# Добавить в deploy/kb-mcp/nginx/conf.d/fakt.conf. Контейнер nginx подключить к сети fakt_runs-net.
# Сертификат runs.pm-workspace.ru выпускается отдельно (certbot webroot, как у остальных доменов).
server {
  listen 8080;
  server_name runs.pm-workspace.ru;
  location /.well-known/acme-challenge/ { root /srv/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 8443 ssl http2;
  server_name runs.pm-workspace.ru;
  ssl_certificate /etc/nginx/tls/runs.pm-workspace.ru/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/runs.pm-workspace.ru/privkey.pem;
  if ($host != runs.pm-workspace.ru) { return 421; }
  # Пакет прогона до 120 МБ: на 8 МБ больше предела приложения.
  client_max_body_size 128m;
  client_body_timeout 120s;
  add_header X-Robots-Tag "noindex" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Перебор пароля: вход ограничен по адресу. Зона fakt_login объявляется в nginx.conf:
  #   limit_req_zone $binary_remote_addr zone=fakt_login:10m rate=10r/m;
  location = /api/auth/login {
    limit_req zone=fakt_login burst=5 nodelay;
    proxy_pass http://runs:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass http://runs:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }
}
